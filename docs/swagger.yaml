basePath: /api
definitions:
  models.ChatMessage:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_verified:
        type: boolean
      related_places:
        description: JSON-encoded string slice
        items:
          type: string
        type: array
      role:
        description: '"user" or "assistant"'
        type: string
      session:
        allOf:
        - $ref: '#/definitions/models.ChatSession'
        description: Relations
      session_id:
        type: string
    type: object
  models.ChatSession:
    properties:
      created_at:
        type: string
      id:
        type: string
      messages:
        items:
          $ref: '#/definitions/models.ChatMessage'
        type: array
      title:
        type: string
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relations
      user_id:
        type: string
    type: object
  models.Notification:
    properties:
      body:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_read:
        type: boolean
      title:
        type: string
      type:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relations
      user_id:
        type: string
    type: object
  models.Place:
    properties:
      best_season:
        description: winter, summer, spring, autumn, any
        type: string
      budget_level:
        description: low, medium, high
        type: string
      category:
        type: string
      city:
        type: string
      created_at:
        type: string
      crowd_level:
        description: quiet, moderate, crowded
        type: string
      description:
        type: string
      duration_needed:
        description: hours
        type: integer
      id:
        type: integer
      name:
        type: string
      rating:
        type: number
      reviews:
        items:
          $ref: '#/definitions/models.PlaceReview'
        type: array
      saved_by:
        items:
          $ref: '#/definitions/models.SavedPlace'
        type: array
      suitable_age:
        description: 'comma-separated: kid,teen,adult,senior'
        type: string
      suitable_for:
        description: 'comma-separated: family,couple,solo,friends'
        type: string
      thumbnail_url:
        description: externally hosted image URL
        type: string
      trip_activities:
        description: Relations
        items:
          $ref: '#/definitions/models.TripActivity'
        type: array
    type: object
  models.PlaceReview:
    properties:
      comment:
        type: string
      created_at:
        type: string
      id:
        type: string
      place:
        $ref: '#/definitions/models.Place'
      place_id:
        type: integer
      rating:
        description: 1-5
        type: integer
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relations
      user_id:
        type: string
    type: object
  models.Preferences:
    properties:
      age_group:
        description: teen / adult / senior
        type: string
      budget:
        description: low / medium / high
        type: string
      crowd_preference:
        description: crowded / quiet / no_preference
        type: string
      interests:
        description: '["history","adventure",…]'
        items:
          type: string
        type: array
      season:
        description: winter / spring / summer / autumn
        type: string
      travel_companion:
        description: solo / couple / family / friends
        type: string
    type: object
  models.SavedPlace:
    properties:
      created_at:
        type: string
      id:
        type: integer
      place:
        $ref: '#/definitions/models.Place'
      place_id:
        type: integer
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relations
      user_id:
        type: string
    type: object
  models.Trip:
    properties:
      created_at:
        type: string
      destinations:
        items:
          $ref: '#/definitions/models.TripDestination'
        type: array
      end_date:
        type: string
      expenses:
        items:
          $ref: '#/definitions/models.TripExpense'
        type: array
      id:
        type: string
      members:
        items:
          $ref: '#/definitions/models.TripMember'
        type: array
      preferences:
        allOf:
        - $ref: '#/definitions/models.Preferences'
        description: same JSON shape as user preferences
      start_date:
        type: string
      status:
        type: string
      title:
        type: string
      travelers_count:
        type: integer
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relations
      user_id:
        type: string
    type: object
  models.TripActivity:
    properties:
      activity_name:
        type: string
      activity_type:
        type: string
      category:
        type: string
      description:
        type: string
      duration_hours:
        type: integer
      end_time:
        type: string
      estimated_cost:
        type: number
      id:
        type: string
      order_in_day:
        type: integer
      place:
        $ref: '#/definitions/models.Place'
      place_id:
        type: integer
      rating:
        type: number
      start_time:
        type: string
      trip_day:
        allOf:
        - $ref: '#/definitions/models.TripDay'
        description: Relations
      trip_day_id:
        type: string
    type: object
  models.TripDay:
    properties:
      activities:
        items:
          $ref: '#/definitions/models.TripActivity'
        type: array
      date:
        type: string
      day_number:
        type: integer
      hours_used:
        type: integer
      id:
        type: string
      trip:
        allOf:
        - $ref: '#/definitions/models.Trip'
        description: Relations
      trip_destination:
        $ref: '#/definitions/models.TripDestination'
      trip_destination_id:
        type: string
      trip_id:
        type: string
    type: object
  models.TripDestination:
    properties:
      category:
        description: dominant category for this city
        type: string
      city:
        type: string
      days_allocated:
        type: integer
      id:
        type: string
      order_in_trip:
        type: integer
      trip:
        allOf:
        - $ref: '#/definitions/models.Trip'
        description: Relations
      trip_days:
        items:
          $ref: '#/definitions/models.TripDay'
        type: array
      trip_id:
        type: string
    type: object
  models.TripExpense:
    properties:
      amount:
        type: number
      category:
        type: string
      created_at:
        type: string
      currency:
        type: string
      date:
        type: string
      description:
        type: string
      id:
        type: string
      trip_id:
        type: string
      updated_at:
        type: string
    type: object
  models.TripMember:
    properties:
      created_at:
        type: string
      role:
        description: owner, editor, viewer
        type: string
      trip:
        $ref: '#/definitions/models.Trip'
      trip_id:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relations
      user_id:
        type: string
    type: object
  models.User:
    properties:
      auth_provider:
        type: string
      avatar_url:
        type: string
      badge_type:
        type: string
      chat_sessions:
        items:
          $ref: '#/definitions/models.ChatSession'
        type: array
      city:
        type: string
      created_at:
        type: string
      email:
        type: string
      explorer_points:
        type: integer
      full_name:
        type: string
      id:
        type: string
      last_login:
        type: string
      notifications:
        items:
          $ref: '#/definitions/models.Notification'
        type: array
      preferences:
        $ref: '#/definitions/models.Preferences'
      reviews:
        items:
          $ref: '#/definitions/models.PlaceReview'
        type: array
      role:
        type: string
      saved_places:
        items:
          $ref: '#/definitions/models.SavedPlace'
        type: array
      trip_members:
        items:
          $ref: '#/definitions/models.TripMember'
        type: array
      trips:
        description: Relations
        items:
          $ref: '#/definitions/models.Trip'
        type: array
      updated_at:
        type: string
    type: object
  services.AddMemberInput:
    properties:
      email:
        type: string
      role:
        enum:
        - editor
        - viewer
        type: string
    required:
    - email
    - role
    type: object
  services.AuthResponse:
    properties:
      tokens:
        $ref: '#/definitions/utils.TokenPair'
      user:
        $ref: '#/definitions/services.UserResponse'
    type: object
  services.ChangePasswordInput:
    properties:
      new_password:
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  services.CreateActivityInput:
    properties:
      activity_name:
        type: string
      activity_type:
        type: string
      category:
        type: string
      description:
        type: string
      duration_hours:
        type: integer
      end_time:
        type: string
      estimated_cost:
        type: number
      place_id:
        type: integer
      start_time:
        type: string
      trip_day_id:
        type: string
    required:
    - activity_name
    - trip_day_id
    type: object
  services.CreateExpenseInput:
    properties:
      amount:
        type: number
      category:
        type: string
      currency:
        type: string
      date:
        type: string
      description:
        type: string
    required:
    - amount
    type: object
  services.CreateReviewInput:
    properties:
      comment:
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - rating
    type: object
  services.CreateTripInput:
    properties:
      end_date:
        description: YYYY-MM-DD
        type: string
      preferences:
        $ref: '#/definitions/models.Preferences'
      start_date:
        description: YYYY-MM-DD
        type: string
      travelers_count:
        minimum: 1
        type: integer
    required:
    - end_date
    - preferences
    - start_date
    - travelers_count
    type: object
  services.ForgotPasswordInput:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  services.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  services.RegisterInput:
    properties:
      email:
        type: string
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 100
        minLength: 6
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  services.ResetPasswordInput:
    properties:
      new_password:
        maxLength: 100
        minLength: 6
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  services.SendMessageInput:
    properties:
      message:
        minLength: 1
        type: string
      session_id:
        type: string
    required:
    - message
    type: object
  services.UpdateActivityInput:
    properties:
      activity_name:
        type: string
      activity_type:
        type: string
      description:
        type: string
      duration_hours:
        type: integer
      end_time:
        type: string
      estimated_cost:
        type: number
      start_time:
        type: string
    type: object
  services.UpdateExpenseInput:
    properties:
      amount:
        type: number
      category:
        type: string
      currency:
        type: string
      date:
        type: string
      description:
        type: string
    type: object
  services.UpdateMemberRoleInput:
    properties:
      role:
        enum:
        - editor
        - viewer
        type: string
    required:
    - role
    type: object
  services.UpdatePreferencesInput:
    properties:
      age_group:
        type: string
      budget:
        type: string
      crowd_preference:
        type: string
      interests:
        items:
          type: string
        type: array
      season:
        type: string
      travel_companion:
        type: string
    type: object
  services.UpdateProfileInput:
    properties:
      avatar_url:
        type: string
      city:
        type: string
      full_name:
        type: string
    type: object
  services.UpdateReviewInput:
    properties:
      comment:
        type: string
      rating:
        maximum: 5
        minimum: 0
        type: integer
    type: object
  services.UpdateTripInput:
    properties:
      end_date:
        type: string
      start_date:
        type: string
      status:
        type: string
      title:
        type: string
      travelers_count:
        type: integer
    type: object
  services.UserResponse:
    properties:
      auth_provider:
        type: string
      avatar_url:
        type: string
      badge_type:
        type: string
      city:
        type: string
      created_at:
        type: string
      email:
        type: string
      explorer_points:
        type: integer
      full_name:
        type: string
      id:
        type: string
      last_login:
        type: string
      preferences:
        $ref: '#/definitions/models.Preferences'
    type: object
  utils.ErrorBody:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/utils.FieldError'
        type: array
      message:
        type: string
    type: object
  utils.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  utils.Meta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  utils.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/utils.ErrorBody'
      meta:
        $ref: '#/definitions/utils.Meta'
      success:
        type: boolean
    type: object
  utils.TokenPair:
    properties:
      access_token:
        type: string
      expires_at:
        type: integer
      refresh_token:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the backend API for the Kemit Trip Planner application.
  title: Kemit Trip Planner API
  version: "1.0"
paths:
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Initiates password reset process
      parameters:
      - description: Email for password reset
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/services.ForgotPasswordInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Forgot password
      tags:
      - auth
  /auth/google:
    post:
      consumes:
      - application/json
      description: Authenticates a user via Google OAuth
      parameters:
      - description: Google Auth Info
        in: body
        name: body
        required: true
        schema:
          properties:
            email:
              type: string
            full_name:
              type: string
            provider_id:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Google authentication
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns JWT tokens
      parameters:
      - description: Login info
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/services.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logs out the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Returns the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a refresh token for a new pair of access and refresh
        tokens
      parameters:
      - description: Refresh Token
        in: body
        name: body
        required: true
        schema:
          properties:
            refresh_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Refresh tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account and returns JWT tokens
      parameters:
      - description: Registration info
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/services.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/services.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Register a new user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets user password using a token
      parameters:
      - description: Reset password info
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/services.ResetPasswordInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Reset password
      tags:
      - auth
  /chat:
    post:
      consumes:
      - application/json
      description: Send a message to the AI and get a response
      parameters:
      - description: Message input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/services.SendMessageInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ChatMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Send message
      tags:
      - chat
  /chat/{id}:
    delete:
      description: Delete a chat session
      parameters:
      - description: Session ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Delete chat session
      tags:
      - chat
    get:
      description: Get a specific chat session with its messages
      parameters:
      - description: Session ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ChatSession'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get chat session
      tags:
      - chat
    put:
      consumes:
      - application/json
      description: Rename an existing chat session
      parameters:
      - description: Session ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: New title
        in: body
        name: body
        required: true
        schema:
          properties:
            title:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Rename chat session
      tags:
      - chat
  /chat/history:
    get:
      description: Get a paginated list of chat sessions for the user
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: List chat sessions
      tags:
      - chat
  /notifications:
    get:
      description: Get a paginated list of notifications for the user
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: List notifications
      tags:
      - notifications
  /notifications/{id}/read:
    put:
      description: Mark a specific notification as read
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
